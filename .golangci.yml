version: "2"
run:
  issues-exit-code: 1
  tests: false
linters:
  default: none
  enable:
    - bodyclose
    - containedctx
    - cyclop
    - depguard
    - dupl
    - durationcheck
    - errname
    - forcetypeassert
    - goconst
    - gocritic
    - godot
    - gosec
    - govet
    - maintidx
    - mnd
    - nestif
    - nilerr
    - nolintlint
    - testpackage
    - unconvert
    - unparam
    - varnamelen
    - whitespace
    - wsl
  settings:
    depguard:
      rules:
        cmd:
          list-mode: strict
          files:
            - '**/cmd/**/*.go'
            - '**/cmd/*.go'
          allow:
            - $all
            - $gostd
            - github.com/spf13/cobra
            - github.com/backup-blob/zfs-backup-blob/internal/driver
            - github.com/backup-blob/zfs-backup-blob/internal/repository
            - github.com/backup-blob/zfs-backup-blob/internal/usecase
            - github.com/backup-blob/zfs-backup-blob/internal/domain
            - github.com/backup-blob/zfs-backup-blob/cmd/command
            - github.com/backup-blob/zfs-backup-blob/pkg/format
            - github.com/golobby/container/v3
        driver:
          list-mode: strict
          files:
            - '**/internal/driver/**/*.go'
            - '**/internal/driver/*.go'
          allow:
            - $gostd
            - gopkg.in/yaml.v3
            - github.com/go-playground/validator/v10
            - github.com/backup-blob/zfs-backup-blob/internal/domain
            - github.com/backup-blob/zfs-backup-blob/pkg
            - github.com/aws/aws-sdk-go-v2
            - github.com/rs/zerolog
            - github.com/jedib0t/go-pretty/v6/table
          deny:
            - pkg: github.com/backup-blob/zfs-backup-blob/internal/repository
              desc: not allowed
            - pkg: github.com/backup-blob/zfs-backup-blob/internal/usecase
              desc: not allowed
        pkg:
          list-mode: strict
          files:
            - '**/pkg/**/*.go'
            - '**/pkg/*.go'
          allow:
            - $all
            - $gostd
            - github.com/fujiwara/shapeio
            - github.com/docker/go-units
          deny:
            - pkg: github.com/backup-blob/zfs-backup-blob/internal
              desc: not allowed
        repo:
          list-mode: strict
          files:
            - '**/internal/repository/**/*.go'
            - '**/internal/repository/*.go'
          allow:
            - $gostd
            - gopkg.in/yaml.v3
            - github.com/backup-blob/zfs-backup-blob/internal/domain
            - github.com/backup-blob/zfs-backup-blob/internal/driver
        usecase:
          list-mode: strict
          files:
            - '**/internal/usecase/**/*.go'
            - '**/internal/usecase/*.go'
          allow:
            - $gostd
            - github.com/backup-blob/zfs-backup-blob/internal/domain
            - github.com/backup-blob/zfs-backup-blob/internal/repository
    errcheck:
      check-type-assertions: true
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    govet:
      disable:
        - fieldalignment
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true
    unparam:
      check-exported: true
    varnamelen:
      max-distance: 12
      min-name-length: 2
    whitespace:
      multi-if: true
      multi-func: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - mnd
        text: 'Magic number: 2, in <condition> detected'
    paths:
      - .*_test.go$
      - pkg/fakemiddleware/fakemiddleware.go$
      - docs
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
